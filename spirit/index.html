<style>
/* Layout: même grammaire que « Suivi finances » (fond doux, carte héro sombre avec courbe, cartes blanches bordées, lignes de 56 px, barre d'onglets blanche), transposée en bleu nuit et corail Linxea. */
:root {
  --bg: #F1F3F7; --surface: #FFFFFF; --line: #DFE3EC; --line-soft: #ECEFF4;
  --ink: #101A33; --ink-2: #47506A; --muted: #5E6780; --faint: #9AA2B6;
  --hero: #0F1B3D; --hero-ink: #FFFFFF; --hero-muted: #BEC6DA; --hero-line: #26345C; --hero-dash: #8C97B3;
  --accent: #EC5B3E; --accent-ink: #B7401F; --accent-soft: #FCE9E3; --accent-on-hero: #FF8A6B;
  --pos: #12805A; --neg: #B3261E; --pill-pos: #3FC48F; --pill-neg: #FF8A80;
  --c1: #1F3A8A; --c2: #EC5B3E; --c3: #1E8E86; --c4: #C98A1B; --c5: #6E56C2; --c6: #4F86E0; --c7: #C24E79;
  --display: "Space Grotesk", "Inter", -apple-system, system-ui, sans-serif;
  --text: "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
  --tabbar: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0A1020; --surface: #121A2E; --line: #222D47; --line-soft: #1A2440;
  --ink: #E9EDF6; --ink-2: #B5BED2; --muted: #98A2BA; --faint: #66708A;
  --hero: #172552; --hero-ink: #FFFFFF; --hero-muted: #BEC6DA; --hero-line: #2C3C6A; --hero-dash: #8C97B3;
  --accent: #FF7A5C; --accent-ink: #FF8E73; --accent-soft: #3A2129; --accent-on-hero: #FF8A6B;
  --pos: #3CC48D; --neg: #FF7B72; --pill-pos: #3FC48F; --pill-neg: #FF8A80;
  --c1: #7096EC; --c2: #FF7A5C; --c3: #3CC2B5; --c4: #F0B54A; --c5: #A68AF0; --c6: #8FB6F5; --c7: #EA7AA3;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0A1020; --surface: #121A2E; --line: #222D47; --line-soft: #1A2440;
  --ink: #E9EDF6; --ink-2: #B5BED2; --muted: #98A2BA; --faint: #66708A;
  --hero: #172552; --hero-ink: #FFFFFF; --hero-muted: #BEC6DA; --hero-line: #2C3C6A; --hero-dash: #8C97B3;
  --accent: #FF7A5C; --accent-ink: #FF8E73; --accent-soft: #3A2129; --accent-on-hero: #FF8A6B;
  --pos: #3CC48D; --neg: #FF7B72; --pill-pos: #3FC48F; --pill-neg: #FF8A80;
  --c1: #7096EC; --c2: #FF7A5C; --c3: #3CC2B5; --c4: #F0B54A; --c5: #A68AF0; --c6: #8FB6F5; --c7: #EA7AA3;
  color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink); font: 14px/1.4 var(--text); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 24px); display: flex; flex-direction: column; gap: 14px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Barre du haut */
.bar-top { display: flex; align-items: center; gap: 8px; }
.bar-top .spacer { flex: 1; }
.ctl { height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; font-weight: 500; }
.ctl.icon { width: 44px; padding: 0; justify-content: center; }
.seg { display: inline-flex; height: 44px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 2px; }
.seg button { height: 34px; border: 0; background: none; padding: 0 12px; border-radius: 8px; font-weight: 500; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 600; }
.page-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.page-title h1 { margin: 0; font: 600 26px/1.15 var(--display); letter-spacing: -0.01em; }
.page-title span { color: var(--muted); font-size: 13px; }

/* Carte héro */
.hero { background: var(--hero); color: var(--hero-ink); border-radius: 18px; padding: 18px 18px 14px; }
.hero h2 { margin: 0; font-size: 13px; font-weight: 500; color: var(--hero-muted); }
.hero .amount { font: 600 36px/1.15 var(--display); margin-top: 2px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.hero .sub { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 8px; font-size: 12.5px; color: var(--hero-muted); }
.pill { padding: 2px 8px; border-radius: 7px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--hero); }
.hero .pill.pos { background: var(--pill-pos); color: #0F1B3D; } .hero .pill.neg { background: var(--pill-neg); color: #0F1B3D; }
.chart { position: relative; height: 96px; margin-top: 12px; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart .tip { position: absolute; top: -6px; transform: translate(-50%, -100%); background: var(--surface); color: var(--ink); font-size: 12px; padding: 5px 8px; border-radius: 8px; pointer-events: none; white-space: nowrap; box-shadow: 0 4px 14px rgba(5, 10, 25, 0.25); }
.axis { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--hero-muted); margin-top: 4px; }
.legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--hero-muted); margin-top: 10px; }
.legend i { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--accent-on-hero); vertical-align: middle; margin-right: 6px; }
.legend i.dash { border-top: 1.5px dashed var(--hero-dash); }

/* Cartes */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 4px 14px; min-width: 0; }
.card.pad { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 12px 0 6px; }
.card.pad .card-h { padding: 0; }
.card-h h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.card-h .total { font: 600 20px var(--display); font-variant-numeric: tabular-nums; }
.link { border: 0; background: none; padding: 0; color: var(--accent-ink); font-weight: 600; font-size: 13px; min-height: 32px; }

.row { display: flex; align-items: center; gap: 12px; min-height: 56px; width: 100%; padding: 8px 0; border: 0; border-top: 1px solid var(--line-soft); background: none; text-align: left; color: var(--ink); }
.card-h + .row, .row.first, .list > .row:first-child { border-top: 0; }
.row .tile { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none; font-weight: 600; font-size: 13px; }
.row .sq { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.row .t { flex: 1; min-width: 0; }
.row .t b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .t span { display: block; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .v { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row .v b { display: block; font-weight: 600; }
.row .v span { display: block; font-size: 12.5px; }
.row .chev { color: var(--faint); }
.tile.todo { background: var(--accent-soft); color: var(--accent-ink); }
.pos { color: var(--pos); } .neg { color: var(--neg); }

.stack { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; margin: 4px 0 6px; }
.stack i { display: block; height: 100%; }

.kv { display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 48px; border-top: 1px solid var(--line-soft); }
.kv:first-of-type { border-top: 0; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
dl { margin: 0; }

.alloc { display: grid; grid-template-columns: 132px 1fr; gap: 16px; align-items: center; padding: 6px 0 14px; }
.donut { width: 132px; height: 132px; position: relative; }
.donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.donut .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.donut .c b { font: 600 17px var(--display); font-variant-numeric: tabular-nums; }
.donut .c span { font-size: 11.5px; color: var(--muted); }
.alloc ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; min-width: 0; }
.alloc li { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; font-size: 13px; }
.alloc li span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.alloc li .sq { width: 10px; height: 10px; border-radius: 3px; }
@media (max-width: 360px) { .alloc { grid-template-columns: 1fr; justify-items: center; } }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); font-weight: 600; }
details.year > summary { list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 52px; cursor: pointer; border-top: 1px solid var(--line-soft); }
details.year:first-of-type > summary { border-top: 0; }
details.year > summary::-webkit-details-marker { display: none; }
details.year > summary b { font: 600 17px var(--display); }
details.year > summary span { color: var(--muted); font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
details.year > summary svg { transition: transform .2s; }
details.year[open] > summary svg { transform: rotate(90deg); }

.progress { height: 8px; border-radius: 4px; background: var(--line-soft); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.note { margin: 0; font-size: 13px; color: var(--ink-2); }
.note.muted { color: var(--muted); }

.btn { min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; padding: 0 16px; }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.danger { color: var(--neg); }
.btn.danger.armed { background: var(--neg); border-color: var(--neg); color: #fff; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.empty { text-align: center; padding: 18px 8px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.foot { text-align: center; font-size: 12px; color: var(--muted); margin: 4px 0 0; }

/* Barre d'onglets */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabbar nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tabbar button { min-height: 52px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 500; color: var(--ink-2); position: relative; }
.tabbar button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-current="page"] { color: var(--accent-ink); font-weight: 600; }
.tabbar .badge { position: absolute; top: 2px; left: 54%; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; }

/* Feuilles */
.scrim { position: fixed; inset: 0; background: rgba(6, 10, 22, 0.45); z-index: 40; opacity: 0; transition: opacity .2s; }
.scrim.open { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 560px; margin: 0 auto; max-height: calc(100% - env(safe-area-inset-top, 0px) - 24px); background: var(--bg); border-radius: 18px 18px 0 0; display: flex; flex-direction: column; transform: translateY(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1); }
.sheet.open { transform: none; }
.sheet-h { display: flex; justify-content: space-between; align-items: center; min-height: 56px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.sheet-h h3 { margin: 0; font: 600 17px var(--display); }
.sheet-b { overflow-y: auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.field input, .field select, .field textarea { width: 100%; min-height: 48px; padding: 0 13px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; }
.field textarea { min-height: 140px; padding: 12px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qlist { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 0 14px; }
.qrow { display: grid; grid-template-columns: 1fr 116px; gap: 10px; align-items: center; min-height: 64px; border-top: 1px solid var(--line-soft); }
.qrow:first-child { border-top: 0; }
.qrow b { display: block; font-weight: 500; }
.qrow span { font-size: 12px; color: var(--muted); }
.qrow input { width: 100%; min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); text-align: right; font-size: 16px; font-variant-numeric: tabular-nums; }
.toast { position: fixed; left: 50%; bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 18px); transform: translate(-50%, 16px); opacity: 0; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 12px; font-weight: 600; z-index: 60; transition: .25s; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .sheet, .scrim, .toast, details.year > summary svg { transition: none; } }
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<div class="tabbar"><nav aria-label="Navigation">
  <button data-tab="synthese"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v11h14V9"/></svg>Synthèse<span class="badge" id="todo-badge" hidden></span></button>
  <button data-tab="supports"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5V12l6 6"/></svg>Supports</button>
  <button data-tab="operations"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>Opérations</button>
  <button data-tab="contrat"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Contrat</button>
</nav></div>

<div class="scrim" id="scrim" hidden></div>

  <div class="sheet-h"><h3 id="sheet-title"></h3><button class="link" id="sheet-close">Fermer</button></div>
  <div class="sheet-b" id="sheet-body"></div>
</section>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
"use strict";
const KEY = "spirit2.data.v1", TABKEY = "spirit2.tab";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const eur = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" });
const eur0 = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
const nf = (d = 2) => new Intl.NumberFormat("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (x, d = 2) => (x > 0 ? "+" : "") + nf(d).format(x * 100) + " %";
const signed = x => (x > 0 ? "+" : x < 0 ? "−" : "") + eur.format(Math.abs(x));
const iso = d => d.toISOString().slice(0, 10);
const today = () => iso(new Date());
const parseD = s => new Date(s + "T12:00:00");
const fmtD = s => parseD(s).toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" });
const uid = () => Math.random().toString(36).slice(2, 10);
const num = v => { const n = parseFloat(String(v).replace(/\s/g, "").replace(",", ".")); return isFinite(n) ? n : 0; };
const TYPES = { euro: "Fonds euros", uc: "Unité de compte", scpi: "SCPI / immobilier" };
const OPS = {
  versement: { label: "Versement", badge: "+", color: "var(--pos)" },
  rachat: { label: "Rachat", badge: "−", color: "var(--neg)" },
  arbitrage: { label: "Arbitrage", badge: "⇄", color: "var(--c1)" },
  interets: { label: "Intérêts", badge: "%", color: "var(--c4)" },
  frais: { label: "Frais", badge: "€", color: "var(--muted)" }
};
const PALETTE = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6", "--c7"];

/* ---------- Data ---------- */
function demoData() {
  const open = "2021-03-15";
  const ops = [{ id: uid(), date: open, type: "versement", amount: 10000, label: "Versement initial" }];
  const now = new Date();
  for (let d = new Date(2021, 3, 5); d <= now; d.setMonth(d.getMonth() + 1))
    ops.push({ id: uid(), date: iso(new Date(d.getFullYear(), d.getMonth(), 5, 12)), type: "versement", amount: 300, label: "Versement programmé" });
  ops.push({ id: uid(), date: "2023-06-12", type: "arbitrage", amount: 3000, label: "Fonds euros → Amundi MSCI World" });
  ops.push({ id: uid(), date: "2024-11-04", type: "arbitrage", amount: 1500, label: "Amundi S&P 500 → Amundi MSCI Emerging" });
  [[2021, 92.4], [2022, 168.1], [2023, 251.7], [2024, 298.3], [2025, 321.9]].forEach(([y, a]) =>
    ops.push({ id: uid(), date: `${y}-12-31`, type: "interets", amount: a, label: "Participation aux bénéfices" }));
  const supports = [
    { id: uid(), name: "Fonds Euro Nouvelle Génération", isin: "Fonds euros Spirica", type: "euro", amount: 8420.35 },
    { id: uid(), name: "Amundi MSCI World UCITS ETF", isin: "LU1681043599", type: "uc", units: 34.218, nav: 589.40, pru: 452.10 },
    { id: uid(), name: "Amundi S&P 500 UCITS ETF", isin: "LU1681048804", type: "uc", units: 82.5, nav: 118.76, pru: 88.40 },
    { id: uid(), name: "Amundi MSCI Emerging Markets", isin: "LU1681045370", type: "uc", units: 640, nav: 5.48, pru: 4.95 }
  ];
  const data = { demo: true, contract: {
    name: "Linxea Spirit 2", number: "SP2-00000000", holder: "Exemple", insurer: "Spirica", openDate: open,
    mode: "Gestion libre", feesUC: "0,50 %/an", feesEuro: "0,60 %/an", feesEntry: "0 %", beneficiary: "Clause standard"
  }, supports, operations: ops, history: [] };
  // monthly valuation history (illustrative)
  const total = supports.reduce((s, x) => s + value(x), 0);
  const start = parseD(open), months = [];
  for (let d = new Date(start.getFullYear(), start.getMonth() + 1, 0, 12); d < now; d = new Date(d.getFullYear(), d.getMonth() + 2, 0, 12)) months.push(new Date(d));
  const finalRatio = total / investedAt(ops, today());

  openSheet("Importer", `<p class="note muted">Collez une sauvegarde exportée depuis cette application, ou choisissez le fichier .json. Les données actuelles seront remplacées.</p>
    <div class="field"><label for="i-file">Fichier</label><input id="i-file" type="file" accept="application/json,.json"></div>
    <div class="field"><label for="i-json">Ou collez le texte</label><textarea id="i-json" placeholder='{"contract": …}'></textarea></div>
    <button class="btn primary" id="i-go">Importer</button>`, b => {
    $("#i-file", b).onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $("#i-json", b).value = r.result; }; r.readAsText(f); };
    $("#i-go", b).onclick = () => {
      try {
        const d = JSON.parse($("#i-json", b).value);
        if (!d || !Array.isArray(d.supports) || !Array.isArray(d.operations)) throw 0;
        state = { ...emptyData(), ...d, demo: false }; closeSheet(); commit("Données importées");
      } catch (e) { toast("Ce texte n'est pas une sauvegarde valide"); }
    };
  });
}
function sheetStart() {
  openSheet("Vos données", `<p class="note">L'application démarre avec un contrat fictif. Pour passer au vôtre :</p>
    <ol class="note" style="margin:0;padding-left:20px;display:grid;gap:6px">
      <li>Ouvrez votre espace client Linxea dans Safari.</li>
      <li>Renseignez les caractéristiques du contrat (onglet Contrat).</li>
      <li>Ajoutez chaque support : nom, ISIN, nombre de parts, VL et PRU.</li>
      <li>Ajoutez vos versements depuis l'historique des opérations.</li>
      <li>Ensuite, une mise à jour régulière des VL suffit (bouton ↻).</li>
    </ol>
    <button class="btn primary" id="st-go">Effacer l'exemple et commencer</button>
    <button class="btn" id="st-keep">Garder l'exemple pour l'instant</button>`, b => {
    $("#st-go", b).onclick = () => { state = emptyData(); tab = "contrat"; saveTab(); closeSheet(); commit(); sheetContract(); };
    $("#st-keep", b).onclick = closeSheet;
  });
}
function saveTab() { try { localStorage.setItem(TABKEY, tab); } catch (e) {} }

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; saveTab(); return render(); }
  if (t.dataset.goto) { tab = t.dataset.goto; saveTab(); return render(); }
  if (t.dataset.period) { ui.period = t.dataset.period; return render(); }
  if (t.dataset.alloc) { ui.allocBy = t.dataset.alloc; return render(); }
  if (t.dataset.opf) { ui.opFilter = t.dataset.opf; return render(); }
  if (t.dataset.support) return sheetSupport(t.dataset.support);
  if (t.dataset.op) return sheetOp(t.dataset.op);
  const a = t.dataset.act; if (!a) return;
  if (a === "wipe") { if (!t.classList.contains("armed")) { t.classList.add("armed"); t.textContent = "Confirmer l'effacement"; setTimeout(() => { if (t.isConnected) { t.classList.remove("armed"); t.textContent = "Effacer toutes les données"; } }, 3500); return; } state = emptyData(); return commit("Données effacées"); }
  if (a === "demo") { if (!t.classList.contains("armed")) { t.classList.add("armed"); t.textContent = "Confirmer"; return; } state = demoData(); save(); render(); return toast("Exemple rechargé"); }
  ({ quick: sheetQuick, "add-support": () => sheetSupport(), "add-op": () => sheetOp(), "edit-contract": sheetContract, "add-snap": sheetSnap, export: sheetExport, import: sheetImport, start: sheetStart, sync: sheetSync }[a] || (() => {}))();
});
document.addEventListener("input", e => {
  if (e.target.id !== "sim") return;
  const amt = num(e.target.value), m = metrics(), out = $("#sim-out");
  if (!amt || m.v <= 0) { out.textContent = "Saisissez un montant pour voir la part de gains imposable."; return; }
  const g = Math.max(0, m.pv) / m.v * Math.min(amt, m.v);
  const age = yearsSince(state.contract.openDate).y;
  out.innerHTML = `Sur ${eur0.format(Math.min(amt, m.v))} rachetés : <b>${eur0.format(g)}</b> de gains et ${eur0.format(Math.min(amt, m.v) - g)} de capital.` +
    (age >= 8 ? ` ${g <= 4600 ? "Ces gains restent sous l'abattement de 4 600 € (impôt sur le revenu)." : "La part au-delà de 4 600 € est imposable."} Les prélèvements sociaux s'appliquent selon les règles en vigueur.` : " Avant 8 ans, ces gains sont imposables (prélèvement forfaitaire), en plus des prélèvements sociaux.");
});
$("#sheet-close").onclick = closeSheet; $("#scrim").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => tab === "synthese" && drawChart(), 150); });

render();
if (state.demo) save();
try { if ("serviceWorker" in navigator && window.top === window && location.protocol === "https:" && document.querySelector('link[rel="manifest"]')) navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}
})();
</script>

</body>
</html>
